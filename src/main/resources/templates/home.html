<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Posts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 15px;
        }
        h1 {
            padding: 20px 0;
            text-align: start;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-row {
            margin: 20px 0;
            padding: 15px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-group label {
            margin-right: 10px;
            font-weight: bold;
            min-width: 70px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-right: 15px;
            margin-bottom: 5px;
        }
        .checkbox-item input {
            margin-right: 5px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 10px auto;
        }
        .post {
            flex: 1 1 calc(50% - 15px);
            border: 1px solid #ccc;
            padding: 15px;
            box-sizing: border-box;
        }
        .post h2 {
            font-size: 1.2em;
        }
        .meta {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 8px;
        }
        .content {
            line-height: 1.4;
        }
        a {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
    </style>
</head>
<body>

<h1>My Blog Application</h1>

<div class="actions">
    <div class="add">
        <a th:href="@{/newpost}">Add Post</a>
    </div>

    <form class="search" th:action="@{/}" method="get">
        <input type="text" name="search" th:value="${keyword}" placeholder="Search..." />
        <button type="submit">Search</button>
    </form>

    <form class="sort" th:action="@{/}" method="get">
        <input type="hidden" name="search" th:value="${keyword}" />
        <input type="hidden" name="sortField" value="publishedAt" />

        <input type="hidden" name="authorId"
               th:each="authorId : ${selectedAuthorIds}"
               th:value="${authorId}" />
        <input type="hidden" name="tagId"
               th:each="tagId : ${selectedTagIds}"
               th:value="${tagId}" />

        <select name="order">
            <option value="" disabled selected>Sort</option>
            <option value="desc">New to Old</option>
            <option value="asc">Old to New</option>
        </select>
        <button type="submit">Sort</button>
    </form>

    <form th:action="@{/}" method="get">
        <div class="filter-row">
            <input type="hidden" name="search" th:value="${keyword}" />
            <input type="hidden" name="sortField" value="publishedAt" />
            <input type="hidden" name="order" th:value="${order}" />

            <div class="filter-group">
                <label>Authors:</label>
                <div th:each="author : ${authors}" class="checkbox-item">
                    <input type="checkbox"
                           name="authorId"
                           th:value="${author.id}"
                           th:checked="${selectedAuthorIds != null and selectedAuthorIds.contains(author.id)}" />
                    <span th:text="${author.name}">Author Name</span>
                </div>
            </div>

            <div class="filter-group">
                <label>Tags:</label>
                <div th:each="tag : ${tags}" class="checkbox-item">
                    <input type="checkbox"
                           name="tagId"
                           th:value="${tag.id}"
                           th:checked="${selectedTagIds != null and selectedTagIds.contains(tag.id)}" />
                    <span th:text="${tag.name}">Tag Name</span>
                </div>
            </div>

            <button type="submit">Apply</button>
        </div>
    </form>
</div>

<div class="container">
    <div th:each="post : ${posts}" class="post">
        <a th:href="@{/post/{id}(id=${post.id})}">
            <h2 th:text="${post.title}">Post Title</h2>
            <p class="meta">
                <span th:text="${post.user.name}">Author Name</span> |
                <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Published Date</span>
            </p>
            <div class="content" th:text="${post.excerpt}">Post Content</div>
        </a>
    </div>
    <div class="pagination" style="text-align:center; margin:20px 0;">

        <!-- Previous Page -->
        <form th:if="${currentPage > 0}" th:action="@{/}" method="get" style="display:inline;">
            <input type="hidden" name="page" th:value="${currentPage - 1}" />
            <input type="hidden" name="search" th:value="${keyword}" />
            <input type="hidden" name="sortField" value="publishedAt" />
            <input type="hidden" name="order" th:value="${order}" />

            <!-- preserve selected authors -->
            <input type="hidden" name="authorId"
                   th:each="authorId : ${selectedAuthorIds}"
                   th:value="${authorId}" />

            <!-- preserve selected tags -->
            <input type="hidden" name="tagId"
                   th:each="tagId : ${selectedTagIds}"
                   th:value="${tagId}" />

            <button type="submit">Previous</button>
        </form>

        <!-- Page Info -->
        <span style="margin: 0 15px;">
        Page <span th:text="${currentPage + 1}"></span>
        of <span th:text="${totalPages}"></span>
    </span>

        <!-- Next Page -->
        <form th:if="${currentPage + 1 < totalPages}" th:action="@{/}" method="get" style="display:inline;">
            <input type="hidden" name="page" th:value="${currentPage + 1}" />
            <input type="hidden" name="search" th:value="${keyword}" />
            <input type="hidden" name="sortField" value="publishedAt" />
            <input type="hidden" name="order" th:value="${order}" />

            <!-- preserve selected authors -->
            <input type="hidden" name="authorId"
                   th:each="authorId : ${selectedAuthorIds}"
                   th:value="${authorId}" />

            <!-- preserve selected tags -->
            <input type="hidden" name="tagId"
                   th:each="tagId : ${selectedTagIds}"
                   th:value="${tagId}" />

            <button type="submit">Next</button>
        </form>
    </div>


</div>

</body>
</html>
